[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiproxy"
version = "0.1.0"
description = "Token-stripping intercept proxy for Cursor / Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mitmproxy>=11.0.0",
  "aiohttp>=3.10.0",
  "pyyaml>=6.0.0",
  "tiktoken>=0.8.0",
]

[project.scripts]
aiproxy = "aiproxy.__main__:main"

[tool.setuptools.packages.find]
include = ["aiproxy*"]
