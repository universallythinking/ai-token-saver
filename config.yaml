# aiproxy — token-stripping intercept proxy for Cursor

listen_host: "127.0.0.1"
listen_port: 8080
# Live savings dashboard (requested / forwarded / saved tok+chars)
dashboard_port: 8081
# Persisted across launches (totals, recent requests, chart buckets)
stats_path: "logs/stats.json"

# mitm      = HTTPS forward proxy for Cursor default models (streaming fixed)
# reverse   = JSON reverse proxy for Cursor BYOK + Claude Code
# openai    = reverse proxy for Cursor OpenAI Base URL (BYOK) only
# anthropic = reverse proxy for Claude Code ANTHROPIC_BASE_URL only
mode: mitm

# Upstreams for reverse-proxy modes
openai_upstream: "https://api.openai.com"
anthropic_upstream: "https://api.anthropic.com"

# Hosts whose request bodies we try to rewrite
intercept_hosts:
  - "api2.cursor.sh"
  - "api3.cursor.sh"
  - "api4.cursor.sh"
  - "*.cursor.sh"
  - "*.cursorapi.com"
  - "api.openai.com"
  - "api.anthropic.com"

# Exact hosts to short-circuit with 204 (leave empty unless you know a safe target)
block_hosts: []
# Suffix match for obvious analytics — does not affect Cursor API hosts
block_host_suffixes:
  - "amplitude.com"
  - "sentry.io"
  - "segment.io"
  - "segment.com"
  - "mixpanel.com"

strip:
  # Keep only the last N messages (messages[] or input[]). System/developer kept separately.
  max_messages: 24

  # Hard cap on any single message/content part (chars). Older turns get stricter caps.
  # For Cursor Connect/protobuf: prefer dedupe over hard truncating unique context —
  # aggressive caps caused upstream 400 "content missing".
  max_chars_recent: 200000
  max_chars_old: 200000

  # How many trailing turns count as "recent"
  recent_turn_window: 6

  # Drop assistant thinking / reasoning blocks when present as separate parts
  drop_reasoning_parts: true

  # Collapse duplicate fenced code / path-labeled file dumps to one copy
  dedupe_file_blocks: true

  # Truncate old tool/function results aggressively
  max_tool_result_chars: 2000

  # Stub embedded file/code blobs inside agent WebSocket / RunSSE prompts.
  # (BidiAppend file-sync is never rewritten — that breaks replies.)
  max_bidi_file_chars: 2000

  # Remove noisy top-level keys Cursor / clients sometimes attach
  drop_keys:
    - "include_obfuscation"
    - "prompt_cache_retention"
    - "store"
    - "metadata"
    - "safety_identifier"
    - "service_tier"

  # Optional: strip long repeated "Rules" / "Always applied" blobs from system text
  compress_system: true
  max_system_chars: 12000

  # Dry-run: log savings but forward the original body.
  # Live rewrite is on; a safety gate skips applies that would drop >50% of chars.
  dry_run: false

logging:
  level: INFO
  # Write before/after JSON samples (redacted) for tuning rules
  dump_dir: "logs"
  dump_bodies: true
  # Only dump when we actually changed something
  dump_only_when_stripped: true